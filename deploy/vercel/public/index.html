<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marking Luka dan Parut</title>
<style>
  :root { --bg:#f4f6f9; --card:#fff; --ink:#1b2430; --mut:#6a7686; --line:#dbe1e9; --pri:#1f5fbf; --pri2:#e8f0fc; --red:#c0392b; --grn:#2e8b57; --amb:#b7791f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12161c; --card:#1b212a; --ink:#e7ebf0; --mut:#9aa6b5; --line:#2c3541; --pri:#6aa6ff; --pri2:#1d2a40; --red:#ff7b6b; --grn:#5fd08f; --amb:#e6b450; } }
  * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui,"Segoe UI",Roboto,sans-serif; }
  header { padding:12px 18px; border-bottom:1px solid var(--line); background:var(--card); display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  header h1 { font-size:17px; margin:0; } .chip { font-size:12px; padding:2px 9px; border-radius:99px; border:1px solid var(--grn); color:var(--grn); }
  main { display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:14px; padding:14px 18px; align-items:start; } @media (max-width:980px) { main { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; } .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px; }
  button,select,input { font:inherit; color:inherit; } button { background:var(--pri2); color:var(--pri); border:1px solid var(--pri); border-radius:7px; padding:6px 11px; cursor:pointer; } button.solid { background:var(--pri); color:#fff; } button.sel { background:var(--pri); color:#fff; }
  input[type=text],input[type=number],select { background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:5px 7px; max-width:100%; }
  #stage { overflow:auto; max-height:76vh; border:1px solid var(--line); border-radius:8px; background:#0d1014; } canvas { display:block; width:100%; height:auto; cursor:crosshair; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px 12px; margin:8px 0; } label { display:flex; flex-direction:column; font-size:12px; color:var(--mut); gap:2px; }
  .hint { color:var(--mut); font-size:12.5px; margin:4px 0 8px; } #msg { margin:8px 0; padding:8px 10px; border-radius:8px; display:none; } #msg.err { display:block; background:#c0392b22; color:var(--red); } #msg.inf { display:block; background:var(--pri2); color:var(--pri); }
  .flag { border-left:3px solid var(--red); padding:4px 8px; margin:4px 0; background:#c0392b14; } .tech { border-left:3px solid var(--pri); padding:4px 8px; margin:5px 0; background:var(--pri2); }
  table { border-collapse:collapse; width:100%; font-size:13px; } td,th { border-bottom:1px solid var(--line); padding:3px 6px; text-align:left; } .big { font-size:26px; font-weight:700; } small { color:var(--mut); }
  .tabs { display:flex; gap:4px; margin-bottom:10px; flex-wrap:wrap; } .pane { display:none; } .pane.on { display:block; } .res canvas { width:100%; border-radius:8px; border:1px solid var(--line); margin-top:8px; cursor:default; }
</style>
</head>
<body>
<header><h1>Marking Luka dan Parut (versi browser)</h1><span class="chip">semua dihitung di browser ini; foto tidak diunggah</span><small>Prototipe riset, bukan alat medis tervalidasi. Ahli bedah memutuskan.</small></header>
<main>
  <section class="card">
    <div class="bar"><input type="file" id="file" accept="image/*"></div>
    <div class="bar" id="modes">
      <button data-mode="calib" class="sel">1. Kalibrasi skala</button><button data-mode="line">2. Garis luka</button><button data-mode="contour">2b. Kontur luka</button><button data-mode="rstl">3. Arah RSTL</button>
      <button data-mode="s_rstl">RSTL ahli</button><button data-mode="s_suture">Jahitan ahli</button><button data-mode="s_contour">Kontur ahli</button>
      <button id="undo">Urung</button><button id="clear">Hapus tanda</button>
    </div>
    <div id="stage"><canvas id="cv" width="900" height="560"></canvas></div><p class="hint" id="modehint"></p>
  </section>
  <section class="card">
    <div class="tabs" id="tabs"><button data-pane="plan" class="sel">Rencana</button><button data-pane="val">Validasi ahli</button></div>
    <div id="msg"></div>
    <div class="pane on" id="p-plan">
      <div class="grid">
        <label>Jenis<select id="kind"><option value="laserasi_baru">Laserasi baru</option><option value="parut">Parut</option></select></label>
        <label>Mekanisme<select id="mech"><option value="tajam">Tajam</option><option value="tumpul_remuk">Tumpul atau remuk</option><option value="gigitan">Gigitan</option><option value="lain">Lain</option></select></label>
        <label>Kedalaman<select id="depth"><option value="tidak_diketahui">Belum diketahui</option><option value="superfisial">Superfisial</option><option value="subkutan">Subkutan</option><option value="otot_fascia">Otot atau fasia</option><option value="tulang_tulang_rawan">Tulang atau tulang rawan</option></select></label>
        <label>Kontaminasi<select id="contam"><option value="bersih">Bersih</option><option value="ringan">Ringan</option><option value="berat">Berat</option></select></label>
        <label>Kehilangan jaringan<select id="loss"><option value="tidak">Tidak</option><option value="kecil">Kecil</option><option value="bermakna">Bermakna</option></select></label>
        <label>Jam sejak cedera<input type="number" id="hours" value="2" min="0"></label>
        <label>Jenis parut<select id="scarType"><option value="linear_melebar">Linear melebar</option><option value="kontraktur_web">Kontraktur atau web</option><option value="hipertrofik">Hipertrofik</option><option value="keloid">Keloid</option><option value="cekung">Cekung</option></select></label>
        <label>Usia parut (bulan)<input type="number" id="scarMonths" value="12" min="0"></label>
        <label>Usia pasien (tahun)<input type="number" id="age" min="0"></label>
        <label>Wilayah<select id="region"><option value="cheek">Pipi</option><option value="forehead">Dahi</option><option value="brow">Alis</option><option value="periorbital">Periorbital</option><option value="nose">Hidung</option><option value="lip">Bibir</option><option value="perioral">Perioral</option><option value="chin">Dagu</option><option value="glabella">Glabela</option><option value="outside_face_oval">Tepi wajah</option></select></label>
        <label>Arah RSTL (derajat, 0 = horizontal)<input type="number" id="rstl" value="0" step="1"></label>
        <label>Jarak jahitan kulit (mm)<input type="number" id="spacing" value="4" step="0.5" min="2"></label>
      </div>
      <div class="bar"><button class="solid" id="btnPlan">Buat rencana marking</button><button id="btnPng">Unduh PNG</button><button id="btnTxt">Unduh laporan (JSON)</button></div>
      <div class="res" id="res"></div><div class="res" id="afterBox"></div>
    </div>
    <div class="pane" id="p-val">
      <p class="hint">Fase 2: ahli menggambar versinya (RSTL, jahitan, kontur) SEBELUM melihat rencana alat. Alat membandingkan dan menyediakan CSV.</p>
      <div class="grid"><label>ID kasus<input type="text" id="caseId"></label><label>ID ahli<input type="text" id="surgeonId"></label></div>
      <div class="bar"><button class="solid" id="btnCmp">Bandingkan</button><button id="btnCsv">Unduh CSV</button></div><div class="res" id="cmp"></div>
    </div>
  </section>
</main>
<script src="lib.js"></script>
<script>
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const S = { img:null, W:0, H:0, mode:'calib', calib:[], line:[], contour:[], rstl:[], sRstl:[], sSut:[], sCon:[], ppm:null, result:null, rows:[] };
const cv = $('#cv'), ctx = cv.getContext('2d');
const HINT = { calib:'Klik dua titik yang jaraknya Anda ketahui (penggaris atau kartu skala), lalu isi panjang mm.', line:'Klik titik sepanjang luka dari ujung ke ujung.', contour:'Klik poligon kontur luka atau lesi (kontur manual; tidak ada AI di versi browser).', rstl:'Klik dua titik sepanjang arah RSTL menurut Anda (menimpa kolom arah RSTL).',
  s_rstl:'AHLI: dua titik arah RSTL.', s_suture:'AHLI: satu titik per jahitan kulit.', s_contour:'AHLI: poligon kontur.' };

const lw = () => Math.max(2, S.W / 600);

  S.sSut.forEach((p, i) => { ctx.fillStyle = '#ffd60a'; ctx.beginPath(); ctx.arc(p[0], p[1], lw()*2.4, 0, 7); ctx.fill(); ctx.font = `${Math.max(12, S.W/80)}px sans-serif`; ctx.fillText(i + 1, p[0] + lw()*3, p[1] - lw()*3); }); }
function pos(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; }
cv.addEventListener('click', e => {
  if (!S.img) return; const p = pos(e);
  if (S.mode === 'calib') { S.calib.push(p); if (S.calib.length === 2) { const mm = parseFloat(prompt('Panjang sebenarnya (mm):', '10')); const d = Math.hypot(S.calib[1][0] - S.calib[0][0], S.calib[1][1] - S.calib[0][1]);
      if (mm > 0 && d > 2) { S.ppm = d / mm; msg(`Skala: ${S.ppm.toFixed(2)} px/mm (kalibrasi manual)`, 'inf'); } else msg('Kalibrasi tidak valid.'); S.calib = []; } }
  else if (S.mode === 'line') S.line.push(p); else if (S.mode === 'contour') S.contour.push(p);
  else if (S.mode === 'rstl') { if (S.rstl.length >= 2) S.rstl = []; S.rstl.push(p); if (S.rstl.length === 2) { const a = FP.lineAngle([S.rstl[0][0], -S.rstl[0][1]], [S.rstl[1][0], -S.rstl[1][1]]); $('#rstl').value = Math.round(a); } }
  else if (S.mode === 's_rstl') { if (S.sRstl.length >= 2) S.sRstl = []; S.sRstl.push(p); } else if (S.mode === 's_suture') S.sSut.push(p); else if (S.mode === 's_contour') S.sCon.push(p);
  redraw();
});
$$('#modes [data-mode]').forEach(b => b.onclick = () => { S.mode = b.dataset.mode; $$('#modes [data-mode]').forEach(x => x.classList.toggle('sel', x === b)); $('#modehint').textContent = HINT[S.mode]; });
$('#modehint').textContent = HINT.calib;
$('#undo').onclick = () => { ({calib:S.calib, line:S.line, contour:S.contour, rstl:S.rstl, s_rstl:S.sRstl, s_suture:S.sSut, s_contour:S.sCon}[S.mode] || []).pop(); redraw(); };
$('#clear').onclick = () => { S.calib = []; S.line = []; S.contour = []; S.rstl = []; S.sRstl = []; S.sSut = []; S.sCon = []; redraw(); };
$$('#tabs button').forEach(b => b.onclick = () => { $$('#tabs button').forEach(x => x.classList.toggle('sel', x === b)); $$('.pane').forEach(p => p.classList.toggle('on', p.id === 'p-' + b.dataset.pane)); });
$('#file').onchange = e => { const f = e.target.files[0]; if (!f) return; const url = URL.createObjectURL(f); const im = new Image(); im.onload = () => { S.img = im; S.W = im.naturalWidth; S.H = im.naturalHeight; cv.width = S.W; cv.height = S.H; S.ppm = null; $('#clear').click(); URL.revokeObjectURL(url); msg('Foto dimuat di browser. Mulai dengan kalibrasi skala.', 'inf'); }; im.src = url; };

const toMm = p => [p[0] / S.ppm, -p[1] / S.ppm], toPx = q => [q[0] * S.ppm, -q[1] * S.ppm];
function ctxBody() { return { kind:$('#kind').value, mechanism:$('#mech').value, depth:$('#depth').value, contamination:$('#contam').value, tissue_loss:$('#loss').value, hours:+$('#hours').value || 0, scar_type:$('#scarType').value, scar_months:+$('#scarMonths').value || 0, age_years:$('#age').value === '' ? null : +$('#age').value, region:$('#region').value }; }
function centerlineOfPolygon(poly) { // principal-axis centre line of a contour (px)
  const n = poly.length, c = poly.reduce((a, p) => [a[0] + p[0] / n, a[1] + p[1] / n], [0, 0]); let sxx = 0, sxy = 0, syy = 0; poly.forEach(p => { const x = p[0] - c[0], y = p[1] - c[1]; sxx += x*x; sxy += x*y; syy += y*y; });
  const th = 0.5 * Math.atan2(2*sxy, sxx - syy), u = [Math.cos(th), Math.sin(th)], v = [-u[1], u[0]]; const t = poly.map(p => (p[0]-c[0])*u[0] + (p[1]-c[1])*u[1]), s = poly.map(p => (p[0]-c[0])*v[0] + (p[1]-c[1])*v[1]);
  const lo = Math.min(...t), hi = Math.max(...t), out = [], B = 12;
  for (let i = 0; i < B; i++) { const a = lo + (hi - lo) * i / B, b = lo + (hi - lo) * (i + 1) / B; const idx = t.map((x, j) => j).filter(j => t[j] >= a && t[j] <= b); if (!idx.length) continue; const tm = (a + b) / 2, sm = idx.reduce((q, j) => q + s[j], 0) / idx.length; out.push([c[0] + u[0]*tm + v[0]*sm, c[1] + u[1]*tm + v[1]*sm]); }
  return out.length >= 2 ? out : [[c[0] + u[0]*lo, c[1] + u[1]*lo], [c[0] + u[0]*hi, c[1] + u[1]*hi]];
}
function build() {
  if (!S.img) throw new Error('Muat foto dulu.'); if (!S.ppm) throw new Error('Kalibrasi skala dulu (langkah 1).');
  let linePx = S.line, shape = null;
  if (S.contour.length >= 3) { const polyMm = S.contour.map(toMm); shape = FP.shapeOf(polyMm); if (!shape) throw new Error('Kontur tidak valid.'); linePx = centerlineOfPolygon(S.contour); }
  if (linePx.length < 2) throw new Error('Tandai luka: garis (langkah 2) atau kontur (2b).');
  const Q = linePx.map(toMm); if (FP.arc(Q).cum.slice(-1)[0] < 0.5) throw new Error('Garis luka terlalu pendek atau titik berimpit.');
  const rstlDeg = parseFloat($('#rstl').value); if (!isFinite(rstlDeg)) throw new Error('Arah RSTL tidak valid.');

function drawPlan(b, layers) {
  redrawClean(); const L = lw(); const { Q, rep } = b; const P = q => toPx(q); const poly = (arr, col, close, dash) => { ctx.strokeStyle = col; ctx.lineWidth = L; ctx.setLineDash(dash || []); ctx.beginPath(); arr.forEach((q, i) => { const p = P(q); i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); }); if (close) ctx.closePath(); ctx.stroke(); ctx.setLineDash([]); };
  if (S.contour.length >= 3) { ctx.strokeStyle = '#3cdc3c'; ctx.lineWidth = L; ctx.beginPath(); S.contour.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.stroke(); }
  const c = Q.reduce((a, q) => [a[0] + q[0] / Q.length, a[1] + q[1] / Q.length], [0, 0]), r = rep.elliptical_excision.axis_deg * Math.PI / 180, d = [Math.cos(r), Math.sin(r)], span = 45;
  poly([[c[0] - d[0]*span, c[1] - d[1]*span], [c[0] + d[0]*span, c[1] + d[1]*span]], '#ffffff', false, [L*3, L*3]);

  if (layers.includes('z_plasty')) FP.zSeries(Q, 60, 15).forEach(z => ['central', 'arm_1', 'arm_2'].forEach(k => poly(z[k], '#e63ce6')));
  if (layers.includes('w_plasty')) FP.wPlasty(Q, 6).forEach(l => poly(l, '#ff8c00'));
  if (layers.includes('gblc')) poly(FP.gblc(Q, 7), '#ffe600', false, [L*2, L*2]);
  poly(Q, '#ffffff', false);
  if (layers.includes('suture_guide')) { const sp = +$('#spacing').value || 4; FP.sutureGuide(Q, sp, 3).forEach(s => { const a = P(s.a), bb = P(s.b); ctx.strokeStyle = '#000'; ctx.lineWidth = L + 2; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(bb[0], bb[1]); ctx.stroke(); ctx.strokeStyle = '#fff'; ctx.lineWidth = L; ctx.stroke();
      ctx.fillStyle = '#ff2d2d'; [a, bb].forEach(p => { ctx.beginPath(); ctx.arc(p[0], p[1], L*1.2, 0, 7); ctx.fill(); }); ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000'; ctx.font = `${Math.max(12, S.W/70)}px sans-serif`; ctx.lineWidth = 3; ctx.strokeText(s.order, a[0] + L*2, a[1]); ctx.fillText(s.order, a[0] + L*2, a[1]); }); }
  const bar = 10 * S.ppm, bx = S.W * 0.04, by = S.H * 0.95; ctx.strokeStyle = '#000'; ctx.lineWidth = L + 3; ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + bar, by); ctx.stroke(); ctx.strokeStyle = '#fff'; ctx.lineWidth = L; ctx.stroke(); ctx.fillStyle = '#fff'; ctx.font = `${Math.max(12, S.W/60)}px sans-serif`; ctx.fillText('10 mm', bx, by - 8);
}
function redrawClean() { drawBase(); }
function afterIllustration(b) {
  const box = $('#afterBox'); box.innerHTML = ''; const name = b.plan.teknik[0] ? b.plan.teknik[0].nama : '';
  if (!b.plan.rencana_jahitan || !name.startsWith('Penutupan primer')) return;
  const c2 = document.createElement('canvas'); c2.width = S.W; c2.height = S.H; const g = c2.getContext('2d'); g.drawImage(S.img, 0, 0);
  const wPx = Math.max(4, 6 * S.ppm), pts = b.linePx; const ring = []; // average colour of a ring around the wound, then a soft patch over the wound band
  const samp = S.contour.length >= 3 ? S.contour : pts; const bb = [Math.min(...samp.map(p => p[0])), Math.min(...samp.map(p => p[1])), Math.max(...samp.map(p => p[0])), Math.max(...samp.map(p => p[1]))];
  const mx = 18 * S.ppm; const x0 = Math.max(0, bb[0] - mx), y0 = Math.max(0, bb[1] - mx), x1 = Math.min(S.W, bb[2] + mx), y1 = Math.min(S.H, bb[3] + mx);
  const tmp = document.createElement('canvas'); tmp.width = x1 - x0; tmp.height = y1 - y0; const tg = tmp.getContext('2d'); tg.drawImage(S.img, x0, y0, tmp.width, tmp.height, 0, 0, tmp.width, tmp.height);

  g.save(); g.beginPath(); if (fillPoly) { fillPoly.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); } else { g.lineWidth = wPx; g.lineCap = 'round'; pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); }

  g.restore();
  const Q = b.Q; g.strokeStyle = 'rgba(180,60,60,.95)'; g.lineWidth = Math.max(2, 0.9 * S.ppm); g.beginPath(); Q.map(toPx).forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.stroke();
  FP.sutureGuide(Q, +$('#spacing').value || 4, 2).forEach(s => { const a = toPx(s.a), bq = toPx(s.b); g.strokeStyle = '#1a1a1a'; g.lineWidth = Math.max(1.5, 0.45 * S.ppm); g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(bq[0], bq[1]); g.stroke(); g.fillStyle = '#111'; g.beginPath(); g.arc(a[0], a[1], Math.max(1.5, 0.5 * S.ppm), 0, 7); g.fill(); });
  g.fillStyle = 'rgba(0,0,0,.65)'; g.fillRect(0, S.H - Math.max(44, S.H * 0.06), S.W, Math.max(44, S.H * 0.06)); g.fillStyle = '#ffd24d'; g.font = `${Math.max(14, S.W / 55)}px sans-serif`; g.fillText('ILUSTRASI SKEMATIK pasca penjahitan. Bukan prediksi hasil kosmetik.', 12, S.H - Math.max(14, S.H * 0.02));
  box.innerHTML = '<h4>Gambar akhir setelah penutupan (ilustrasi)</h4>'; box.appendChild(c2);
}
function renderText(b) {
  const { plan: p, rep: r, shape } = b; let h = `<p><span class="big">${r.length_mm} mm</span> <small>panjang | sudut ke RSTL ${r.mean_angle_to_rstl_deg} derajat (${esc(r.alignment)}) | skala ${S.ppm.toFixed(1)} px/mm</small></p>`;
  if (shape) h += `<p><small>Lesi: luas ${shape.area_mm2} mm2; ${shape.major_mm} x ${shape.minor_mm} mm; elongasi ${shape.elongation}; solidity ${shape.solidity}; ${shape.linear ? 'linear' : '<b>tidak linear: tanpa garis jahitan otomatis</b>'}.</small></p>`;
  p.peringatan_merah.forEach(f => h += `<div class="flag">${esc(f)}</div>`); p.catatan.forEach(f => h += `<div class="flag" style="border-color:var(--amb)">${esc(f)}</div>`);
  p.teknik.forEach(t => h += `<div class="tech"><b>${t.peringkat}. ${esc(t.nama)}</b><br>${esc(t.alasan)}${t.ukuran ? '<br><i>' + esc(t.ukuran) + '</i>' : ''}${t.pilihan_per_region ? '<br>Pilihan: ' + t.pilihan_per_region.map(esc).join('; ') : ''}</div>`);
  const s = p.rencana_jahitan; if (!s) h += '<h4>Rencana jahitan</h4><p>Tidak ada garis jahitan untuk rencana ini.</p>'; else h += `<h4>Rencana jahitan</h4><table>${s.lapisan.map(l => `<tr><td>${esc(l.lapis)}</td><td>${esc(l.bahan)}</td></tr>`).join('')}</table><p>Kulit: <b>${s.perkiraan_jumlah_jahitan_kulit}</b> jahitan tiap ${+$('#spacing').value || 4} mm; dalam: <b>${s.perkiraan_jumlah_jahitan_dalam}</b> tiap ${s.jarak_antar_jahitan_dalam_mm} mm; lepas: ${esc(s.lepas_jahitan)}.<br><small>${esc(s.urutan)}</small></p>`;
  h += `<h4>Tidak diketahui dari foto</h4><ul>${p.hal_yang_tidak_diketahui_dari_foto.map(u => '<li>' + esc(u) + '</li>').join('')}</ul><small>${esc(p.status)}</small>`; $('#res').innerHTML = h;
}
$('#btnPlan').onclick = () => { try { const b = build(); S.result = b; drawPlan(b, b.plan.marking_layers.length || !b.plan.rencana_jahitan ? b.plan.marking_layers : ['suture_guide']); renderText(b); afterIllustration(b); msg(''); } catch (x) { msg(x.message); } };
$('#btnPng').onclick = () => { if (!S.result) return msg('Buat rencana dulu.'); const a = document.createElement('a'); a.download = 'rencana_marking.png'; a.href = cv.toDataURL('image/png'); a.click(); };
$('#btnTxt').onclick = () => { if (!S.result) return msg('Buat rencana dulu.'); const b = S.result; const a = document.createElement('a'); a.download = 'rencana_marking.json'; a.href = URL.createObjectURL(new Blob([JSON.stringify({ skala_px_per_mm: S.ppm, laporan: b.rep, rencana: b.plan }, null, 2)], { type: 'application/json' })); a.click(); };
function polyMask(poly) { const c = document.createElement('canvas'); c.width = S.W; c.height = S.H; const g = c.getContext('2d'); g.fillStyle = '#fff'; g.beginPath(); poly.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); g.fill(); const d = g.getImageData(0, 0, S.W, S.H).data; const m = new Uint8Array(S.W * S.H); for (let i = 0; i < m.length; i++) m[i] = d[i * 4] > 127 ? 1 : 0; return m; }
$('#btnCmp').onclick = () => {
  try { if (!S.result) throw new Error('Buat rencana alat dulu (tab Rencana), lalu gambar versi ahli.'); const b = S.result, o = {};
    const toolSut = FP.sutureGuide(b.Q, +$('#spacing').value || 4, 3).map(s => toPx(s.centre)); if (S.sSut.length) o.sutures = FP.matchSutures(toolSut, S.sSut, S.ppm);
    if (S.sRstl.length === 2) { const sa = FP.lineAngle([S.sRstl[0][0], -S.sRstl[0][1]], [S.sRstl[1][0], -S.sRstl[1][1]]); o.rstl_diff = Math.round(FP.diff(sa, parseFloat($('#rstl').value)) * 10) / 10; }
    if (S.sCon.length >= 3 && S.contour.length >= 3) { const a = polyMask(S.contour), c = polyMask(S.sCon); let i = 0, sa = 0, sb = 0; for (let k = 0; k < a.length; k++) { i += a[k] & c[k]; sa += a[k]; sb += c[k]; } o.dice = Math.round(2 * i / (sa + sb) * 1000) / 1000; }
    if (!Object.keys(o).length) throw new Error('Belum ada marking ahli yang digambar.');
    S.rows.push({ case: $('#caseId').value || 'kasus', surgeon: $('#surgeonId').value || 'ahli', dice: o.dice ?? '', rstl_diff_deg: o.rstl_diff ?? '', suture_count_diff: o.sutures?.count_difference ?? '', suture_median_mm: o.sutures?.median_distance_mm ?? '' });
    $('#cmp').innerHTML = '<table>' + Object.entries({ 'Dice kontur': o.dice, 'Selisih RSTL (derajat)': o.rstl_diff, 'Jahitan alat/ahli': o.sutures ? o.sutures.n_tool + '/' + o.sutures.n_surgeon : undefined, 'Median jarak jahitan cocok (mm)': o.sutures?.median_distance_mm }).filter(([, v]) => v !== undefined).map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('') + `</table><small>${S.rows.length} baris terkumpul.</small>`; msg(''); } catch (x) { msg(x.message); } };
$('#btnCsv').onclick = () => { if (!S.rows.length) return msg('Belum ada baris.'); const k = Object.keys(S.rows[0]); const csv = [k.join(','), ...S.rows.map(r => k.map(x => r[x]).join(','))].join('\n'); const a = document.createElement('a'); a.download = 'validasi_ahli.csv'; a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.click(); };
</script>
