# Production stack for a small VPS: the app, PostgreSQL, and Caddy for automatic HTTPS (the camera needs HTTPS).
# Run from this folder:  docker compose up -d --build     (see deploy.sh, which also creates .env)
services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: facestudio
      POSTGRES_DB: facestudio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U facestudio"], interval: 5s, timeout: 3s, retries: 20 }
  app:
    build: ../..
    restart: always
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql://facestudio:${POSTGRES_PASSWORD}@db:5432/facestudio
      PORT: "7860"
    expose: ["7860"]
  caddy:
    image: caddy:2-alpine
    restart: always
    depends_on: [app]
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN:?set DOMAIN in .env}" }
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
volumes:
  pgdata:
  caddy_data:
  caddy_config:
