[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "facial-plastic-surgery-planner"
version = "0.1.0"
description = "Composable facial wound geometry, suture marking and research planning tools"
readme = "docs/PYPI_README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{name = "Muhammad Allam Rafi"}, {name = "Cindy Rizky Afrilia"}]
dependencies = ["numpy>=1.26"]
keywords = ["facial", "geometry", "wound", "research", "suture", "bioinformatics"]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Science/Research", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Medical Science Apps."]

[project.optional-dependencies]
vision = ["opencv-python>=4.9", "mediapipe>=0.10", "onnxruntime>=1.17", "scipy>=1.11", "matplotlib>=3.8"]
bioinformatics = ["scipy>=1.11", "fhir.resources>=8.0"]
dev = ["pytest>=8", "build>=1.2", "twine>=6"]

[project.scripts]
facial-planner = "facial_plastic_surgery_planner.cli:main"

[project.urls]
Homepage = "https://github.com/sharing-123/facial-plastic-surgery-planner"
Repository = "https://github.com/sharing-123/facial-plastic-surgery-planner"
Issues = "https://github.com/sharing-123/facial-plastic-surgery-planner/issues"
"Research archive" = "https://doi.org/10.5281/zenodo.24412867"
Registration = "https://doi.org/10.17605/OSF.IO/ESW47"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
